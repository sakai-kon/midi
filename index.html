<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>MIDI Player</title><script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script><script src="https://unpkg.com/@tonejs/midi@2.0.28/build/Midi.js"></script><style>body{margin:0;background:#07101e;color:#eef2ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(1160px,100%);margin:auto;padding:20px 14px 42px}.title{text-align:center;font-size:clamp(32px,7vw,54px);margin:0;font-weight:850}.sub{text-align:center;color:#a9b5ce;margin:7px 0 22px}.card{background:#111b2fdd;border:1px solid #2b3959;border-radius:18px;padding:16px;margin-top:14px}.drop{border:2px dashed #52678f;border-radius:16px;padding:28px 14px;text-align:center;cursor:pointer}.drop.drag{border-color:#667dff;background:#0d1830}.primary,.btn{border:1px solid #405178;background:#182643;color:#eef2ff;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#667dff}.hidden{display:none!important}.status{text-align:center;min-height:22px;margin-top:10px;color:#aab6cf}.ok{color:#9fe5b4}.error{color:#ff9daa}.autoload{display:block;width:max-content;max-width:100%;margin:10px auto 0;padding:7px 11px;border-radius:999px;background:#0d1830;border:1px solid #304268;color:#b8c4df;font-size:13px}.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-top:14px}.stat{background:#0c1527;border:1px solid #23304b;border-radius:11px;padding:10px}.stat small{color:#8190af}.stat strong{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.section-title{font-size:12px;color:#93a2c2;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px}.current{text-align:center}.note-main{font-size:clamp(44px,11vw,78px);font-weight:900;line-height:1}.note-sub{font-family:ui-monospace,monospace;color:#b5bfd5;margin-top:7px}.notes-list{margin-top:12px;min-height:28px;font-size:18px;color:#dce4f7;word-break:break-word}.partbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.parts{display:grid;gap:9px}.part{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:#0c1527;border:1px solid #24304a;border-radius:12px;padding:11px}.part.disabled{opacity:.52}.part .name{min-width:0}.part .name strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.part .name small{display:block;color:#8190af}.toggle.off{background:#2a1b24;border-color:#60414d}.solo.on{background:#6d5b1f;border-color:#aa9136}.roll-wrap{overflow:auto;padding-bottom:6px}.roll{position:relative;height:320px;min-width:780px;background:#080e1b;border:1px solid #263554;border-radius:13px;overflow:hidden}.roll-canvas{position:relative;height:100%;min-width:780px}.roll-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,140,190,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,190,.08) 1px,transparent 1px);background-size:100% 22px,80px 100%;pointer-events:none}.roll-notes{position:absolute;inset:0}.rnote{position:absolute;height:9px;min-width:3px;border-radius:4px;background:#8296ff}.rnote.muted{opacity:.12}.cursor{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 8px #fff;z-index:10;pointer-events:none}.roll-label{position:absolute;left:8px;top:8px;padding:3px 7px;border-radius:6px;background:#0a1220cc;color:#92a2c1;font-size:11px;z-index:12;pointer-events:none}.piano-wrap{overflow:auto}.piano{position:relative;height:132px;min-width:720px;display:flex;background:#080e1b;border-radius:12px;overflow:hidden;padding:0 5px}.key{position:relative;flex:0 0 34px;height:108px;background:#f5f6f9;color:#111827;border:1px solid #2d3548;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9px}.key.black{position:absolute;z-index:2;width:22px;height:68px;background:#111827;color:#eef2ff;border-radius:0 0 5px 5px}.key.active{background:#8296ff!important;color:#fff!important}.timeline{margin-top:14px}.timeline input,.setting input{width:100%}.time-row{display:flex;justify-content:space-between;color:#9aa8c5;font-size:13px}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}.big{min-width:100px;font-size:17px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.setting label{display:flex;justify-content:space-between;color:#aeb9d0;font-size:13px;margin-bottom:6px}.select{width:100%;background:#101a2e;color:#eef2ff;border:1px solid #344363;border-radius:10px;padding:9px}@media(max-width:680px){.settings{grid-template-columns:1fr}.part{grid-template-columns:auto 1fr auto}.toggle{grid-column:1/-1;width:100%}.app{padding-inline:10px}.roll{height:280px}}</style></head><body><div class="app"><h1 class="title">MIDI Player</h1><p class="sub">MIDIを聴きながら、パート別ON/OFF・Solo・音名・ピアノロール</p><section class="card"><div id="drop" class="drop" tabindex="0" role="button"><h2>🎵 MIDIファイルを読み込む</h2><p>.mid / .midi をここへドラッグ＆ドロップ</p><button id="pick" class="primary" type="button">ファイルを選択</button><input id="file" class="hidden" type="file" accept=".mid,.midi,audio/midi,audio/x-midi"></div><div id="status" class="status">同階層の「unwelcome school」を自動読み込みしています…</div><div id="autoload" class="autoload">⏳ 自動読み込み中</div><div id="info" class="info hidden"></div></section><section id="player" class="hidden"><section class="card current"><div class="section-title">現在の音</div><div id="noteMain" class="note-main">—</div><div id="noteSub" class="note-sub">停止中 / 0:00</div><div id="notesList" class="notes-list">現在鳴っているノートはありません</div></section><section class="card"><div class="section-title">パート</div><div class="partbar"><button id="allOn" class="btn" type="button">全ON</button><button id="allOff" class="btn" type="button">全OFF</button><button id="allSoloOff" class="btn" type="button">Solo解除</button></div><div id="parts" class="parts"></div></section><section class="card"><div class="section-title">ピアノロール</div><div class="roll-wrap"><div id="roll" class="roll"><div id="rollCanvas" class="roll-canvas"><div class="roll-grid"></div><div id="rollNotes" class="roll-notes"></div><div id="cursor" class="cursor"></div><div class="roll-label">横 = 時間　/　縦 = 音高</div></div></div></div></section><section class="card"><div class="piano-wrap"><div id="piano" class="piano"></div></div><div class="timeline"><input id="seek" type="range" min="0" max="0" step="0.01" value="0"><div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div></div><div class="controls"><button id="play" class="btn big" type="button">▶ 先頭から再生</button><button id="pause" class="btn big" type="button">⏸ 一時停止</button><button id="stop" class="btn big" type="button">⏹ 停止</button></div><div class="settings"><div class="setting"><label>音量 <span id="volText">80%</span></label><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></div><div class="setting"><label>再生速度 <span id="speedText">1x</span></label><select id="speed" class="select"><option value="0.1">0.1x</option><option value="0.2">0.2x</option><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select></div></div></section></section></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),e={drop:$('drop'),pick:$('pick'),file:$('file'),status:$('status'),autoload:$('autoload'),info:$('info'),player:$('player'),noteMain:$('noteMain'),noteSub:$('noteSub'),notesList:$('notesList'),parts:$('parts'),allOn:$('allOn'),allOff:$('allOff'),allSoloOff:$('allSoloOff'),roll:$('roll'),rollCanvas:$('rollCanvas'),rollNotes:$('rollNotes'),cursor:$('cursor'),piano:$('piano'),seek:$('seek'),currentTime:$('currentTime'),duration:$('duration'),play:$('play'),pause:$('pause'),stop:$('stop'),volume:$('volume'),volText:$('volText'),speed:$('speed'),speedText:$('speedText')};let midi=null,tracks=[],notes=[],synth=null,duration=0,position=0,playing=false,speed=1,lastPerf=0,raf=0,loadedFile=null,meta={px:80,minMidi:36,maxMidi:96,width:780};const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],jp=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'],bl=[1,3,6,8,10];const hz=n=>440*Math.pow(2,(n-69)/12),mname=n=>names[n%12]+(Math.floor(n/12)-1),jname=n=>jp[n%12]+(Math.floor(n/12)-1),fmt=s=>{s=Math.max(0,Number(s)||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')},esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function status(t,c=''){e.status.textContent=t;e.status.className='status '+c}function hasSolo(){return tracks.some(t=>t.solo)}function audible(t){return t.on&&(!hasSolo()||t.solo)}function stopTransport(){try{Tone.Transport.stop();Tone.Transport.cancel()}catch{}if(synth)try{synth.releaseAll()}catch{}}function ensureSynth(){if(!synth)synth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:.008,decay:.06,sustain:.55,release:.23}}).toDestination();applyVolume()}function applyVolume(){e.volText.textContent=Math.round(+e.volume.value*100)+'%';if(synth)synth.volume.value=Tone.gainToDb(Math.max(.0001,+e.volume.value))}function snapshot(){tracks=midi.tracks.map((t,i)=>({name:(t.name||'').trim()||'パート '+(i+1),channel:t.channel==null?'—':t.channel,on:true,solo:false,notes:t.notes.map(n=>({midi:n.midi,time:+n.time||0,duration:Math.max(.03,+n.duration||.03),velocity:Math.max(.02,Math.min(1,+(n.velocity??.8)))}))}))}function flatten(){notes=[];tracks.forEach((t,ti)=>t.notes.forEach(n=>notes.push({...n,track:ti,name:mname(n.midi),jp:jname(n.midi),freq:hz(n.midi)})));notes.sort((a,b)=>a.time-b.time||a.midi-b.midi)}function getDuration(){return +midi.duration||notes.reduce((m,n)=>Math.max(m,n.time+n.duration),0)||0}function renderInfo(){const ch=new Set(midi.tracks.map(t=>t.channel).filter(x=>x!=null)),tempo=(midi.header.tempos||[]).map(t=>+t.bpm).find(Boolean);e.info.innerHTML='<div class="stat"><small>ファイル</small><strong>'+esc(loadedFile.name)+'</strong></div><div class="stat"><small>サイズ</small><strong>'+((loadedFile.size||0)/1024).toFixed(1)+' KB</strong></div><div class="stat"><small>トラック</small><strong>'+midi.tracks.length+'</strong></div><div class="stat"><small>チャンネル</small><strong>'+(ch.size||'—')+'</strong></div><div class="stat"><small>テンポ</small><strong>'+(tempo?tempo.toFixed(1)+' BPM':'—')+'</strong></div><div class="stat"><small>長さ</small><strong>'+fmt(duration)+'</strong></div><div class="stat"><small>ノート</small><strong>'+notes.length.toLocaleString()+'</strong></div>';e.info.classList.remove('hidden')}function renderParts(){e.parts.innerHTML='';tracks.forEach((t,i)=>{const r=document.createElement('div');r.className='part'+(t.on?'':' disabled');r.innerHTML='<div>🎹</div><div class="name"><strong>'+esc(t.name)+'</strong><small>Track '+(i+1)+' / '+t.notes.length+'ノート / Ch '+esc(t.channel)+'</small></div><button class="btn toggle '+(t.on?'':'off')+'" data-on="'+i+'" type="button">'+(t.on?'🔊 ON':'🔇 OFF')+'</button><button class="btn solo '+(t.solo?'on':'')+'" data-solo="'+i+'" type="button">'+(t.solo?'SOLO中':'Solo')+'</button>';e.parts.appendChild(r)});e.parts.querySelectorAll('[data-on]').forEach(b=>b.onclick=()=>{const i=+b.dataset.on;tracks[i].on=!tracks[i].on;renderParts();renderRoll();if(playing)reschedule(currentPosition())});e.parts.querySelectorAll('[data-solo]').forEach(b=>b.onclick=()=>{const i=+b.dataset.solo,next=!tracks[i].solo;tracks.forEach(t=>t.solo=false);tracks[i].solo=next;renderParts();renderRoll();if(playing)reschedule(currentPosition())})}function renderPiano(){e.piano.innerHTML='';const lo=36,hi=84,wh=[];for(let n=lo;n<=hi;n++)if(!bl.includes(n%12)){const k=document.createElement('div');k.className='key';k.dataset.midi=n;k.textContent=mname(n);e.piano.appendChild(k);wh.push(n)}for(let n=lo;n<hi;n++)if(bl.includes(n%12)){const wi=wh.indexOf(n-1);if(wi>=0){const k=document.createElement('div');k.className='key black';k.dataset.midi=n;k.style.left=(5+wi*34+23)+'px';k.textContent=mname(n);e.piano.appendChild(k)}}}function renderRoll(){e.rollNotes.innerHTML='';if(!notes.length){e.rollCanvas.style.width='780px';meta.px=80;return}const min=Math.min(...notes.map(n=>n.midi)),max=Math.max(...notes.map(n=>n.midi)),span=Math.max(1,max-min),px=Math.max(55,Math.min(140,900/Math.max(1,duration))),width=Math.max(900,duration*px+40);meta={px,minMidi:min,maxMidi:max,width};e.rollCanvas.style.width=width+'px';const h=Math.max(40,e.roll.clientHeight);notes.forEach(n=>{const r=document.createElement('div');r.className='rnote'+(audible(tracks[n.track])?'':' muted');r.style.left=n.time*px+'px';r.style.width=Math.max(3,n.duration*px)+'px';r.style.top=(span?((max-n.midi)/span*(h-24)+8):h/2)+'px';r.title=n.jp+' ('+n.name+') / '+n.freq.toFixed(2)+' Hz';e.rollNotes.appendChild(r)});updateCursor()}function currentPosition(){if(!playing)return position;const now=performance.now();position=Math.min(duration,position+(now-lastPerf)/1000*speed);lastPerf=now;return position}function updateCursor(){e.cursor.style.left=position*meta.px+'px'}function updateUI(){currentPosition();e.seek.max=Math.max(duration,.01);e.seek.value=Math.min(duration,position);e.currentTime.textContent=fmt(position);e.duration.textContent=fmt(duration);const active=notes.filter(n=>n.time<=position&&position<n.time+n.duration&&audible(tracks[n.track]));if(active.length){e.noteMain.textContent=active.map(n=>n.jp).join('  ');e.noteSub.textContent=active.map(n=>n.name+' / '+n.freq.toFixed(2)+' Hz').join('  ');e.notesList.textContent=active.map(n=>n.jp+' ('+n.name+')').join('　')}else{e.noteMain.textContent='—';e.noteSub.textContent=playing?'休符':'停止中 / '+fmt(position);e.notesList.textContent='現在鳴っているノートはありません'}e.piano.querySelectorAll('.key').forEach(k=>k.classList.toggle('active',active.some(n=>n.midi===+k.dataset.midi)));updateCursor();if(position>=duration&&playing){playing=false;stopTransport();position=duration;tick()}}function tick(){cancelAnimationFrame(raf);const loop=()=>{updateUI();if(playing)raf=requestAnimationFrame(loop)};loop()}function scheduleFrom(p){stopTransport();ensureSynth();notes.forEach(n=>{if(!audible(tracks[n.track])||n.time+n.duration<=p)return;const start=Math.max(0,(n.time-p)/speed),dur=Math.max(.02,(n.time+n.duration-Math.max(p,n.time))/speed);Tone.Transport.schedule(time=>{if(synth&&audible(tracks[n.track]))synth.triggerAttackRelease(n.name,dur,time,Math.max(.02,Math.min(1,n.velocity)))},start)});Tone.Transport.start();position=p;lastPerf=performance.now();playing=true;tick()}function reschedule(p){position=Math.max(0,Math.min(duration,p));if(playing){speed=Math.max(.1,Math.min(2,+e.speed.value||1));scheduleFrom(position)}else updateUI()}async function playFrom(p){if(!midi)return;try{await Tone.start()}catch{}speed=Math.max(.1,Math.min(2,+e.speed.value||1));if(position>=duration)position=0;scheduleFrom(Math.max(0,Math.min(duration,p)))}function pause(){position=currentPosition();playing=false;stopTransport();updateUI()}function stop(){playing=false;stopTransport();position=0;updateUI()}async function loadBuffer(buf,name){playing=false;stopTransport();try{const parsed=new Midi(buf);midi=parsed;snapshot();flatten();duration=getDuration();position=0;loadedFile={name,size:buf.byteLength};renderInfo();renderParts();renderPiano();e.player.classList.remove('hidden');renderRoll();updateUI();status(name+' を読み込みました。0:00にセットしました。','ok');if(name==='unwelcome school'){e.autoload.textContent='✅ unwelcome school 読み込み完了';e.autoload.style.color='#9fe5b4'}}catch(err){status('MIDIの読み込みに失敗しました: '+(err?.message||err),'error');e.autoload.textContent='❌ 自動読み込み失敗';e.autoload.style.color='#ff9daa'}}async function loadFile(f){if(!f)return;try{await loadBuffer(await f.arrayBuffer(),f.name)}catch(err){status('ファイルを読み込めませんでした: '+(err?.message||err),'error')}}async function autoLoadBundled(){const local=['./unwelcome%20school','./unwelcome%20school.mid','./unwelcome%20school.midi'];const raw='https://raw.githubusercontent.com/sakai-kon/midi/main/unwelcome%20school';const urls=[...local,raw];for(const url of urls){try{const r=await fetch(url+(url.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)continue;const b=await r.arrayBuffer();if(b.byteLength){await loadBuffer(b,'unwelcome school');return}}catch(err){console.warn('bundled MIDI load failed',url,err)}}status('「unwelcome school」を自動読み込みできませんでした。ファイル選択は使用できます。','error');e.autoload.textContent='⚠️ 自動読み込みできません';e.autoload.style.color='#ffd18a'}e.pick.onclick=ev=>{ev.stopPropagation();e.file.click()};e.drop.addEventListener('click',ev=>{if(ev.target!==e.pick)e.file.click()});e.drop.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();e.file.click()}});e.file.onchange=()=>loadFile(e.file.files?.[0]);['dragenter','dragover'].forEach(t=>e.drop.addEventListener(t,ev=>{ev.preventDefault();e.drop.classList.add('drag')}));['dragleave','drop'].forEach(t=>e.drop.addEventListener(t,ev=>{ev.preventDefault();e.drop.classList.remove('drag')}));e.drop.addEventListener('drop',ev=>{const f=ev.dataTransfer.files?.[0];if(f)loadFile(f)});e.allOn.onclick=()=>{tracks.forEach(t=>t.on=true);renderParts();renderRoll();if(playing)reschedule(currentPosition())};e.allOff.onclick=()=>{tracks.forEach(t=>t.on=false);renderParts();renderRoll();if(playing)reschedule(currentPosition())};e.allSoloOff.onclick=()=>{tracks.forEach(t=>t.solo=false);renderParts();renderRoll();if(playing)reschedule(currentPosition())};e.play.onclick=()=>playFrom(0);e.pause.onclick=pause;e.stop.onclick=stop;e.seek.oninput=()=>reschedule(+e.seek.value);e.volume.oninput=applyVolume;e.speed.onchange=()=>{const p=currentPosition();speed=Math.max(.1,Math.min(2,+e.speed.value||1));e.speedText.textContent=speed+'x';if(playing)reschedule(p);else updateUI()};window.addEventListener('resize',()=>{if(midi)requestAnimationFrame(renderRoll)});window.addEventListener('beforeunload',stopTransport);e.speedText.textContent='1x';applyVolume();renderPiano();updateUI();autoLoadBundled()})();</script></body></html>
